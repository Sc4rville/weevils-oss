<!doctype html>

  <head>

    <title>weevils · aperçu téléphones</title>
    <style>
      /* Outil de vérification sur ordinateur : la même app à 375, 390 et 430 px. */

      figcaption { font-size: 13px; padding-bottom: 6px; opacity: 0.7; }
      iframe { border: 0; display: block; height: 812px; }

  </head>
  <body>
    <figure><figcaption>375</figcaption><iframe src="/" width="375" title="375 px"></iframe></figure>
    <figure><figcaption>390</figcaption><iframe src="/" width="390" title="390 px"></iframe></figure>
    <figure><figcaption>430</figcaption><iframe src="/" width="430" title="430 px"></iframe></figure>
