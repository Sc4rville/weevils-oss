// 1. This browser (localStorage): the setup and the page's private key.
// 2. The address bar (#job=<sid>.<secret>): a reload, or this link opened anywhere, finds the setup again. The secret
//    never reaches a server (it is after the #); from it the page derives the token that opens the setup's status here,
//    and the key that seals its private key, which this service keeps for a page opened elsewhere.
// 3. The service: the setup itself, kept up to 7 days after the end.
// The install encrypts your login link with the public half of the page's key: only a page holding the private half

const enc = new TextEncoder()
const b64 = (bytes) => { let s = ''; for (const b of bytes) s += String.fromCharCode(b); return btoa(s) }
const b64u = (bytes) => b64(bytes).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '')

  const iv = crypto.getRandomValues(new Uint8Array(12))
  const ct = new Uint8Array(await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, await boxKey(secret), enc.encode(JSON.stringify(jwk))))
  const out = new Uint8Array(12 + ct.length)
  out.set(iv)
  out.set(ct, 12)
  return b64(out)
}

}

async function newJob(kind) {
  const pair = await crypto.subtle.generateKey({ name: 'RSA-OAEP', modulusLength: 2048, publicExponent: new Uint8Array([1, 0, 1]), hash: 'SHA-256' }, true, ['encrypt', 'decrypt'])
  const pub = b64(new Uint8Array(await crypto.subtle.exportKey('spki', pair.publicKey)))
  const jwk = await crypto.subtle.exportKey('jwk', pair.privateKey)
  const secret = b64u(crypto.getRandomValues(new Uint8Array(16)))
  const view = await viewOf(secret)
  const j = await api('/api/job', { kind, lang: FR ? 'fr' : 'en', pub, tz: TZ, view, wrapped: await wrapKey(secret, jwk) })
  // A service from before resume links picks its own token: then this browser is the only way back.
  return keep({ sid: j.sid, view: j.view, secret: j.view === view ? secret : '', kind, jwk, command: j.command || '', win: j.win || '', userData: j.userData || '', at: Date.now() })
}

  const view = await viewOf(ref.secret)
  const st = await api('/api/status', { sid: ref.sid, view, full: true })
  let jwk = null
  try { if (st.wrapped) jwk = await unwrapKey(ref.secret, st.wrapped) } catch {}
  return keep({ sid: ref.sid, view, secret: ref.secret, kind: st.kind, jwk, command: st.command || '', win: st.win || '', userData: st.userData || '', at: st.created || Date.now() })
}

  return new TextDecoder().decode(await crypto.subtle.decrypt({ name: 'RSA-OAEP' }, key, unb64(sealed)))

async function continueOn(kind, job, token, s, btn, err) {
  err.hidden = true
  btn.disabled = true
  const label = btn.textContent
  btn.textContent = W.continuing
  try {
    // Made by this very setup (the page was closed right after): it boots and installs by itself.
    if (s.sid && s.sid === job.sid) {
      await api('/api/hetzner/created', { sid: job.sid, view: job.view, server: { id: s.id, name: s.name, ip: s.ip, type: s.type } })
      keep(job)
      return progress(job, { push: true })
    }
    // Still installing: this page now follows that setup (its key opens the link at the end).
    if (s.sid && s.setup && s.setup.state !== 'done' && s.setup.state !== 'failed') {
      try {
        const r = await api('/api/hetzner/attach', { sid: job.sid, view: job.view, label: s.sid, server: s.id })
        if (r.attached && r.sid !== job.sid) job.sid = r.sid
        keep(job)
        return progress(job, { push: true })
      } catch (e) { if (e.message !== 'not_live') throw e }
    }
    // Over, or forgotten: Hetzner gives the server a new root password (asked from here, with the token). It is shown
    // on this page only, never sent anywhere else: the person logs in to the server's console with it and pastes this
    // setup's command there. The install keeps what is there and ends with a fresh link for this page.
    const password = await (await hzLib()).rootPassword(token, s.id)
    keep(job)
    rootScreen(job, password)
  } catch (e) { showErr(err, hzErr(e)); btn.disabled = false; btn.textContent = label }
}
/** A text to copy, in the command's box. */
function copyBox(text) {
  const code = h('code', {}, text)
  const copy = h('button', { type: 'button' }, W.copy)
  copy.onclick = async () => {
    try { await navigator.clipboard.writeText(text) } catch { getSelection().selectAllChildren(code) }
    copy.textContent = W.copied
    setTimeout(() => (copy.textContent = W.copy), 1600)
  }
  return h('div', { class: 'cmd' }, code, copy)
}
/** A server weevils made, whose setup is over or lost: its new root password (from Hetzner, held by this page only),
 * its console at Hetzner, and this setup's command to paste there. */
function rootScreen(job, password) {
  const err = errBox()
  show(band('b1', h('h2', {}, W.rootTitle), h('p', {}, W.root1),
    h('a', { class: 'btn light', href: 'https://console.hetzner.cloud/projects', target: '_blank', rel: 'noopener' }, W.rootConsole),
    h('label', {}, W.rootPw), copyBox(password),
    h('p', {}, W.root2), cmdBox(Promise.resolve(job), err), h('p', { class: 'note' }, W.rootNote), err))
  setBack(() => provider('hetzner', job, '', true))
}
function provider(kind, given, lastError, reopened) {
  // A setup from a host this page no longer offers: back to the choices.
  if (!HOSTS[kind]) return home()
  if (!given && !reopened) hit('chose', kind)
  if (!given || reopened) step(kind)
  HOSTNAME = HOSTS[kind]
  const d = draft.hetzner
  let job = given, token = '', size = d.size || 'recommended', sizes = [], another = false
  const err = errBox()
  const tok = h('input', { type: 'password', autocomplete: 'off', autocapitalize: 'off', spellcheck: 'false', placeholder: '••••••••••••••••', 'aria-label': W.token })
  const pick = h('div', { class: 'sizes', hidden: true })
  const note = h('p', { class: 'small' })
  const createBtn = h('button', { class: 'btn', hidden: true }, W.create)
  const priceBtn = h('button', { class: 'btn light', hidden: true }, W.tryAgain)
  const had = h('div', { hidden: true })
  const price = (z) => money(z.monthly, z.currency)
  // Billed by the hour (Hetzner): the real hourly price, and the monthly one as its cap.
  const hourly = (z) => z.hourly > 0 && new Intl.NumberFormat(FR ? 'fr-FR' : 'en-IE', { style: 'currency', currency: z.currency || 'EUR', minimumFractionDigits: 3, maximumFractionDigits: 4 }).format(z.hourly)
  const label = (z) => hourly(z) ? W.hourly(hourly(z), price(z)) : z.first && z.first !== z.monthly ? W.firstMonth(money(z.first, z.currency), price(z)) : `${price(z)}${W.perMonth}`
  const draw = () => {
    pick.replaceChildren(...sizes.map((z) => h('button', { class: `size${z.size === size ? ' on' : ''}`, type: 'button', onclick: () => { size = d.size = z.size; draw() } },
      h('b', {}, W[`size_${z.size}`]),
      h('span', {}, `${z.memory} ${W.gb} · ${W.agents(z.agents)}`),
      h('strong', {}, label(z)))))
    const z = sizes.find((x) => x.size === size) || sizes[0]
    if (z) createBtn.textContent = hourly(z) ? W.createHourly : W.createFor(z.first && z.first !== z.monthly ? W.firstOnly(money(z.first, z.currency)) : `${price(z)}${W.perMonth}`)
  }
  const showSizes = (on) => { pick.hidden = !on; createBtn.hidden = !on; note.hidden = !on }
  /** Servers weevils already made there: continue on one, or (on purpose) create another. */
  const showHad = (list) => {
    if (!list?.length) return (had.hidden = true), showSizes(true)
    const more = h('button', { class: 'link', type: 'button', onclick: () => { another = true; more.hidden = true; showSizes(true) } }, W.another)
    had.replaceChildren(h('div', { class: 'quote' }, h('b', {}, W.existingTitle(list.length)), h('p', { class: 'small' }, W.existingSub),
      serverList(kind, list, (s, btn) => continueOn(kind, job, token, s, btn, err))), more)
    had.hidden = false
    showSizes(false)
  }
  priceBtn.onclick = async () => {
    err.hidden = true
    token = tok.value.trim()
    priceBtn.disabled = true
    try {
      job ||= await newJob(kind)
      const hz = await hzLib()
      const [q, ex] = await Promise.all([hz.quote(token, REGION), hz.servers(token).catch(() => [])])
      sizes = q.sizes
      if (!sizes.some((z) => z.size === size)) size = sizes[0].size
      draw()
      const billed = W[`billed_${kind}`]
      note.textContent = typeof billed === 'function' ? billed(sizes.some((z) => z.ipv4)) : billed
      priceBtn.hidden = true
      showHad(another ? [] : await withSetups(job, ex))
    } catch (e) { showErr(err, hzErr(e)); priceBtn.hidden = false } finally { priceBtn.disabled = false }
  }
  createBtn.onclick = async () => {
    err.hidden = true
    createBtn.disabled = true
    try {
      const hz = await hzLib()
      // Made in the meantime (another tab, or a page cut off): the list, never a second server without asking.
      if (!another) {
        const ex = await hz.servers(token)
        if (ex.length) { createBtn.disabled = false; return showHad(await withSetups(job, ex)) }
      }
      job.userData ||= (await api('/api/status', { sid: job.sid, view: job.view, full: true })).userData || ''
      if (!job.userData) throw new Error('no_job')
      // Saved before the call: closed while the server is being made, this page comes back to it (the token lists it).
      job.started = true
      keep(job)
      const server = await hz.create(token, { sid: job.sid, size, where: REGION, userData: job.userData })
      tok.value = ''
      d.token = ''
      await api('/api/hetzner/created', { sid: job.sid, view: job.view, server })
      progress(job, { push: true })
    } catch (e) {
      createBtn.disabled = false
      if (e?.hz) api('/api/hetzner/failed', { sid: job.sid, view: job.view, error: hzErr(e) }).catch(() => {})
      showErr(err, hzErr(e))
    }
  }
  // Pasting the token is enough: the sizes come by themselves (recommended picked), one tap on Create starts it.
  let auto = 0
  tok.oninput = () => {
    d.token = tok.value
    showSizes(false); had.hidden = true; priceBtn.hidden = true; err.hidden = true
    clearTimeout(auto)
    const t = tok.value.trim()
    if (/^[A-Za-z0-9|._-]{40,256}$/.test(t)) auto = setTimeout(() => { if (!priceBtn.disabled) priceBtn.onclick() }, 500)
    else if (t) auto = setTimeout(() => showErr(err, 'bad_token'), 1500)
  }
  showSizes(false)
  const steps = [h('li', {}, W.hz1, h('a', { class: 'btn light', href: 'https://accounts.hetzner.com/signUp', target: '_blank', rel: 'noopener' }, W.hz1b)),
       h('li', {}, W.hz2, h('a', { class: 'btn light', href: 'https://console.hetzner.cloud/projects', target: '_blank', rel: 'noopener' }, W.hz2b))]
  show(band('b1', h('h2', {}, W.hzTitle),
    h('ol', { class: 'how' }, ...steps, h('li', {}, W.hz3, h('p', { class: 'small' }, W.hzTip), h('label', {}, W.token), tok, priceBtn, had, pick, note, createBtn)),
    err))
  setBack(() => toStart())
  if (lastError) showErr(err, lastError)
  // Back here (Back, or the phone's gesture): the token typed before, and its sizes again.
  if (d.token) { tok.value = d.token; if (!lastError) priceBtn.onclick() }
}

/** A setup's one-line command, to paste in a terminal on the machine (no secret leaves it), with Copy. The page
 * follows the install as soon as the command starts. */
function cmdBox(jobP, err) {
  let job = null
  const code = h('code', {}, '…')
  const copy = h('button', { type: 'button' }, W.copy)
  copy.onclick = async () => {
    if (!job?.command) return
    try { await navigator.clipboard.writeText(code.textContent) } catch { getSelection().selectAllChildren(code) }
    copy.textContent = W.copied
    setTimeout(() => (copy.textContent = W.copy), 1600)
  }
  jobP.then(async (j) => {
    job = j
    if (!j.command) j.command = (await api('/api/status', { sid: j.sid, view: j.view, full: true })).command || ''
    code.textContent = j.command || '…'
    if (!j.started) watch(j, () => progress(j, { push: true }))
  }).catch((e) => showErr(err, e.message))
  return h('div', { class: 'cmd' }, code, copy)
}

// --- (b) your VPS: the same one-line command as a computer, pasted in the server's own terminal. Nothing secret is
// ever typed on this page.
function ssh(given, reopened) {
  if (!given && !reopened) hit('chose', 'ssh')
  if (!given || reopened) step('vps')
  const err = errBox()
  show(band('b2', h('h2', {}, W.vpsTitle), h('p', {}, W.vpsCmd), cmdBox(given ? Promise.resolve(given) : newJob('ssh'), err), h('p', { class: 'note' }, W.vpsWait), err))
  setBack(() => toStart())
}

// --- (c) a computer
function pcBox(here) {
  const err = errBox()
  const code = h('code', {}, '…')
  const copy = h('button', { type: 'button' }, W.copy)
  const winLine = h('p', { class: 'note' })
  const box = h('div', {}, h('div', { class: 'cmd' }, code, copy), winLine, err)
  let job
  ;(async () => {
    try {
      const s = savedJob()
      job = s && s.kind === 'pc' && s.command ? s : await newJob('pc')
      // Windows: its own command (PowerShell, which hands the install to Ubuntu in WSL); a phone shows both.
      code.textContent = os === 'windows' && job.win ? job.win : job.command
      if (os === 'phone' && job.win) winLine.replaceChildren(W.onWindows, ' ', h('code', {}, job.win))
      // Back here from its install: the same command, no jump forward (the install stays one step ahead).
      if (!job.started) watch(job, () => progress(job, { push: true }))
    } catch (e) { showErr(err, e.message) }
  })()
  let chose = !here
  copy.onclick = async () => {
    if (!job) return
    if (!chose) (chose = true), hit('chose', 'pc')
    try { await navigator.clipboard.writeText(code.textContent) } catch { getSelection().selectAllChildren(code) }
    copy.textContent = W.copied
    setTimeout(() => (copy.textContent = W.copy), 1600)
  }
  if (!here && navigator.share) box.append(h('button', { class: 'btn light', onclick: () => job && navigator.share({ text: code.textContent }).catch(() => {}) }, W.share))
  box.append(h('p', { class: 'note' }, W.pcWhat, ' ', h('a', { href: '/install.sh', target: '_blank', rel: 'noopener' }, W.pcRead), ' · ', h('a', { href: '/security', target: '_blank', rel: 'noopener' }, W.pcSec)), h('p', { class: 'note' }, W.pcNet), h('p', { class: 'note' }, W.pcWait), h('p', { class: 'note' }, W.pcLimit))
  return box
}
function pc(reopened) {
  if (!reopened) hit('chose', 'pc')
  step('computer')
  show(band('b3', h('h2', {}, W.pcTitle), h('p', {}, W.pcIntro), pcBox(false)))
  setBack(() => toStart())
}

// ------------------------------------------------------------------ progress, then your weevils
const ORDER = ['created', 'start', 's_system', 's_source', 's_build', 's_service', 'https', 'done']
const FOLD = { s_config: 's_source', waiting: 's_service', s_https: 'https', tunnel: 'https' }
let watching = 0
/** Polls the setup; calls onMove when the install starts (the PC command was run), onState on every answer. */
function watch(job, onMove, onState, source) {
  const me = ++watching
  let moved = false
  const tick = async () => {
    if (me !== watching) return
    try {
      const s = source ? await source() : await api('/api/status', { sid: job.sid, view: job.view })
      if (me !== watching) return
      if (s.state !== 'waiting' && !moved && onMove) { moved = true; return onMove(s) }
      // A computer's failed install keeps being followed: its command pasted again starts it over.
      if (onState?.(s) === 'stop' || s.state === 'done' || (s.state === 'failed' && job.kind !== 'pc')) return
    } catch (e) {
      if (e.message === 'no_job') { forget(); return onState?.({ state: 'failed', steps: [], error: W.expired }) }
    }
    setTimeout(tick, 2000)
  }
  tick()
}
const hosted = (kind) => kind !== 'ssh' && kind !== 'pc'
/** « Try again », the one way after a failure or a lost key: the token again (its screen lists the server weevils made,
 * « Continue on this one »), the VPS access again, or the computer's command again. */
const tryAgain = (job) => () => { watching++; if (hosted(job.kind)) provider(HOSTS[job.kind] ? job.kind : 'hetzner'); else if (job.kind === 'ssh') ssh(); else { forget(); home() } }

function progress(job, opts = {}) {
  const near = opts.near
  if (!near && job.sid && !job.started) { job.started = true; keep(job) }
  if (opts.push) ahead()
  else try { history.replaceState({ ...history.state, wv: 1, prog: 1, form: '' }, '') } catch {}
  const labels = ORDER.map((k) => k === 'created' ? W[`s_created_${hosted(job.kind) ? 'hetzner' : job.kind}`] : k === 'https' ? (job.kind === 'pc' ? W.s_tunnel : W.s_https) : W[`s_${k.replace(/^s_/, '')}`])
  const items = ORDER.map((k, i) => h('li', {}, h('i', {}, ''), labels[i]))
  const bar = h('div', {}, '')
  const err = errBox()
  const clock = h('p', { class: 'small' }, '')
  const slow = h('div', { class: 'quote', hidden: true }, h('p', {}, W.slow), h('button', { class: 'btn light', onclick: tryAgain(job) }, W.tryAgain))
  const head = near
    ? [h('h2', {}, W.nearTitle), h('p', { class: 'small' }, W.nearSub), h('button', { class: 'btn light', onclick: tryAgain(job) }, W.nearLink), h('button', { class: 'link', onclick: () => { watching++; home() } }, W.notMine)]
    : [h('h2', {}, W.progTitle)]
  show(band('b5', ...head, h('div', { class: 'bar' }, bar), h('ul', { class: 'steps' }, items), clock, slow, near ? null : h('p', { class: 'note' }, W.progNote), err))
  setBack(() => formOf(job.kind))
  let since = 0, stepSeen = '', moved = Date.now()
  const timer = setInterval(() => {
    if (!since) return
    const s = Math.max(0, Math.round((Date.now() - since) / 1000))
    clock.textContent = `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`
    // No step for 20 minutes: the install may have died on the server. Same server, from the start.
    slow.hidden = !(hosted(job.kind) || job.kind === 'ssh') || Date.now() - moved < 20 * 60_000
  }, 1000)
  watch(job, null, (s) => {
    // Nothing started yet (a page reopened before its server was asked for, or the host said no): back to the form.
    if (!near && s.state === 'waiting' && !s.creating && job.kind !== 'pc') {
      clearInterval(timer)
      watching++
      job.kind === 'ssh' ? ssh(job) : provider(job.kind, job, s.createError || '')
      return 'stop'
    }
    since ||= s.created || Date.now()
    const steps = s.steps || []
    if (steps.join() !== stepSeen) (stepSeen = steps.join()), (moved = Date.now())
    const seen = new Set(steps.map((k) => FOLD[k] || k))
    let last = -1
    ORDER.forEach((k, i) => { if (seen.has(k)) last = i })
    // A reported step has started; 'created' is reported once finished.
    const now = ORDER[last] === 'created' || last < 0 ? last + 1 : last
    items.forEach((li, i) => { li.className = i < now || s.state === 'done' ? 'done' : i === now && s.state !== 'failed' ? 'now' : ''; li.firstChild.textContent = li.className === 'done' ? '✓' : '' })
    if (s.creating && !steps.length) items[0].lastChild.textContent = job.kind === 'ssh' ? labels[0] : W.creatingNow
    bar.style.width = `${Math.max(4, Math.round((now / (ORDER.length - 1)) * 100))}%`
    err.hidden = s.state !== 'failed'
    if (s.state === 'failed') {
      if (job.kind !== 'pc') clearInterval(timer)
      slow.hidden = true
      err.replaceChildren(h('b', {}, W.failTitle), h('br'), s.error || '', h('button', { class: 'btn', onclick: tryAgain(job) }, W.tryAgain))
      err.hidden = false
    }
    if (s.state === 'done') {
      clearInterval(timer)
      if (near) { head[0].textContent = W.nearReady; head[1].textContent = ''; return 'stop' }
      ready(job, s)
    }
  }, near ? opts.source : undefined)
}

const IN_APP = /FBAN|FBAV|FB_IAB|Instagram|Twitter|Line\/|LinkedInApp|Snapchat|TikTok|musical_ly|GSA\/|; wv\)/.test(ua)
async function ready(job, s) {
  let link = ''
  if (s.result?.sealed && job.jwk) {
    try { link = await unseal(job, s.result.sealed) } catch {}
  }
  // Only a link to the address the install reported, on that exact origin.
  if (!link || !s.result.url || !link.startsWith(s.result.url + '/#k=')) link = ''
  // Kept: reopening this page (or the resume link) shows this again, until the first login on the new weevils.
  keep({ ...job, done: true })
  const url = s.result?.url || ''
  const sec = [h('h2', {}, W.doneTitle)]
  let switched = false
  const opened = () => { if (!switched) (switched = true), hit('switch', job.kind) }
  if (link) {
    const code = link.slice(link.indexOf('#k=') + 3)
    sec.push(h('p', {}, W.yourAddress), h('p', {}, h('a', { href: link, onclick: opened }, h('b', {}, url.replace(/^https?:\/\//, '')))))
    sec.push(h('p', { class: 'small' }, W.yourCode), h('div', { class: 'cmd' }, h('code', {}, code), copyBtn(code)))
    if (phone) {
      sec.push(h('a', { class: 'btn', href: link, onclick: opened }, W.open), h('div', { class: 'cmd' }, h('code', {}, link), copyBtn(link, W.copyLink)))
      if (IN_APP) sec.push(h('p', { class: 'note' }, h('b', {}, W.inApp)))
    } else if (window.qrcode) {
      const q = qrcode(0, 'M')
      q.addData(link)
      q.make()
      sec.push(h('p', {}, W.scan), Object.assign(h('div', { class: 'qr' }), { innerHTML: q.createSvgTag({ cellSize: 6, margin: 2, scalable: true }) }), h('p', { class: 'note' }, W.scanNote), h('a', { class: 'btn light', href: link, onclick: opened }, W.openHere))
    }
    sec.push(h('p', { class: 'small' }, W.home), h('p', { class: 'note' }, W.keptHere))
  } else {
    sec.push(h('p', {}, h('a', { href: url }, h('b', {}, url.replace(/^https?:\/\//, '')))))
    sec.push(h('p', { class: 'small' }, s.claimed ? W.claimedNote : job.kind === 'pc' ? W.noSeal : W.lostKey))
    if (job.kind !== 'pc') sec.push(h('button', { class: 'btn', onclick: tryAgain(job) }, W.freshLink))
  }
  show(band('b1', ...sec))
  setBack(() => formOf(job.kind))
}

// ------------------------------------------------------------------ start: back to the setup, wherever it is kept
/** The setup's current state decides the screen: never the start while something is installing. */
async function route(job) {
  let s
  try { s = await api('/api/status', { sid: job.sid, view: job.view }) } catch (e) {
    if (e.message === 'no_job') { forget(); return home(W.expired) }
    // No network for now: the progress screen keeps asking.
    return progress(job)
  }
  // Logged in to the new weevils and its link gone from here: this setup is over, the page starts fresh.
  if (s.state === 'done' && s.claimed && !s.result?.sealed) { forget(); return home() }
  if (s.state === 'done') return ready(job, s)
  if (s.state !== 'waiting' || s.creating) return progress(job)
  if (job.kind === 'pc') { home(); if (!computer) pc(); return }
  if (job.kind === 'ssh') return ssh(job)
  return provider(job.kind, job, s.createError)
}
// Back and forward (the phone's gesture, the browser's arrows): the step at that entry, with what was typed on it.
window.addEventListener('popstate', () => {
  watching++
  const st = history.state || {}
  const ref = fromLink(location.hash)
  const f = st.form || (/^#(hetzner|vps|computer)$/.exec(location.hash) || [])[1]
  if (f) {
    // This browser's setup for that form stays the same one (never a second setup replacing a started one).
    const kind = f === 'vps' ? 'ssh' : f === 'computer' ? 'pc' : f
    if (kind === 'pc' && computer) return toStart()
    return formOf(kind)
  }
  if (ref && (st.prog || !st.wv)) return restore(ref).then(route, () => toStart())
  toStart()
})
hit('open')
;(async () => {
  const ref = fromLink(location.hash)
  const s = savedJob()
  // Something to come back to: never the start screen meanwhile, even for a moment.
  if (ref || s) show(band('b5', h('p', {}, W.backTo)))
  if (ref) {
    try { return await route(await restore(ref)) } catch (e) {
      if (e.message === 'no_job') { forget(); return home(W.expired) }
    }
  }
  if (s) return route(keep(s))
  // Left for Hetzner's site (or a reload) before anything started: the same screen, the token field waiting.
  const at = savedStep()
  if (at === 'hetzner') return provider('hetzner', null, '', true)
  if (at === 'vps') return ssh(null, true)
  if (at === 'computer' && !computer) return pc(true)
  home()
})()
